<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#142925" />
    <title>The Wild Above</title>
  </head>
  <body>
    <header>
      <strong>THE WILD ABOVE</strong><span>PHASE 0 · FIELD STATION</span
      ><a href="/">Play</a><a id="lab-link" href="/?lab">Rig Lab</a>
    </header>
    <main>
      <div id="game"></div>
      <aside id="inspector" hidden>
        <div id="pane"></div>
        <label
          >Component
          <select id="components"></select
        ></label>
        <pre id="details"></pre>
        <button id="export">Export configuration</button
        ><label class="import"
          >Import configuration<input
            id="import"
            type="file"
            accept="application/json"
        /></label>
        <p id="error" role="alert"></p>
      </aside>
    </main>
    <footer>
      <span id="status">Starting…</span
      ><button id="interact">Exit Mech · F</button
      ><span id="help">WASD / arrows · Shift run · Q/E turn · F board</span>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
